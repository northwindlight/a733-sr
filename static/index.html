<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A733 视频超分</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#fff; --soft:#f2f4f7; --line:#e4e7ec; --line2:#d2d8e1;
    --fg:#101418; --dim:#6b7280; --dim2:#9aa2ad;
    --acc:#2563eb; --acc-soft:#eef3ff; --acc-line:#c3d5fb;
    --ok:#0d8a4f; --err:#d92d20; --warn:#b25e09;
    --r:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg);color:var(--fg);
    font:14px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans CJK SC","PingFang SC",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:940px;margin:0 auto;padding:40px 20px 80px}
  .num{font-variant-numeric:tabular-nums}

  /* ---- 页头 ---- */
  .hd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:22px}
  .hd h1{font-size:22px;font-weight:650;letter-spacing:-.01em;margin:0}
  .hd p{margin:0;color:var(--dim);font-size:13px}

  /* ---- 状态条 ---- */
  .stat{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
  .chip{
    flex:1 1 148px;min-width:132px;text-align:left;font:inherit;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:11px 14px 12px;cursor:pointer;transition:border-color .15s,background .15s;
  }
  .chip:hover{border-color:var(--line2)}
  .chip.on{border-color:var(--acc);background:var(--acc-soft)}
  .chip .k{display:block;font-size:11.5px;color:var(--dim);letter-spacing:.03em}
  .chip .v{display:block;font-size:19px;font-weight:620;letter-spacing:-.01em;
           line-height:1.35;font-variant-numeric:tabular-nums}
  .chip .s{display:block;font-size:11.5px;color:var(--dim2);
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip.mute .v{color:var(--dim2);font-weight:500}

  /* ---- 详情 ---- */
  .det{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
       padding:16px 18px;margin:-14px 0 22px;display:none}
  .det.on{display:block}
  .det h3{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--dim);
          letter-spacing:.04em;text-transform:uppercase}
  .det h3:not(:first-child){margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
  .det .note{color:var(--dim);font-size:12.5px;margin-top:10px;line-height:1.7}
  .det .note b{color:var(--fg);font-weight:600}

  .mrow{display:flex;align-items:center;gap:12px;padding:4px 0;font-size:13px}
  .mrow .nm{flex:0 0 152px;color:var(--dim);overflow:hidden;
            text-overflow:ellipsis;white-space:nowrap}
  .mrow .nm b{color:var(--fg);font-weight:500}
  .mrow .bw{flex:1;height:6px;background:var(--soft);border-radius:99px;overflow:hidden;min-width:40px}
  .mrow .bw i{display:block;height:100%;width:0;border-radius:99px;
              background:var(--acc);transition:width .35s ease}
  .mrow .vl{flex:0 0 92px;text-align:right;font-variant-numeric:tabular-nums;color:var(--fg)}
  .mrow .vl small{color:var(--dim2);font-size:11.5px}

  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 20px;font-size:13px}
  .kv dt{color:var(--dim)}
  .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}

  /* ---- 卡片 ---- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
        padding:20px;margin-bottom:18px}
  .card>h2{margin:0 0 16px;font-size:14px;font-weight:600}

  /* ---- 上传 ---- */
  .drop{border:1.5px dashed var(--line2);border-radius:var(--r);padding:38px 20px;
        text-align:center;cursor:pointer;transition:.15s;background:var(--soft)}
  .drop:hover,.drop.on{border-color:var(--acc);background:var(--acc-soft)}
  .drop b{display:block;font-size:15px;font-weight:600;margin-bottom:4px}
  .drop span{color:var(--dim);font-size:12.5px}

  .fields{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
  .fields label{color:var(--dim);font-size:12.5px;margin-right:-4px}
  select,input[type=text]{
    background:var(--panel);color:var(--fg);border:1px solid var(--line2);
    border-radius:9px;padding:9px 11px;font:inherit;outline:none;transition:border-color .15s}
  select:focus,input[type=text]:focus{border-color:var(--acc)}
  input[type=text]{flex:1 1 260px;min-width:200px}
  button{font:inherit;border-radius:9px;cursor:pointer;transition:.15s;border:0}
  .btn{background:var(--acc);color:#fff;padding:10px 20px;font-weight:600}
  .btn:hover{background:#1d4fd8}
  .btn.ghost{background:var(--panel);color:var(--fg);border:1px solid var(--line2);font-weight:500}
  .btn.ghost:hover{border-color:var(--acc);color:var(--acc)}
  button:disabled{opacity:.45;cursor:default}

  /* 说明文字一律不放界面上；保留 .note 只给"读不到"那一句用 */

  /* ---- 任务 ---- */
  .job{padding:14px 0;border-top:1px solid var(--line)}
  .job:first-of-type{border-top:0;padding-top:0}
  .job .top{display:flex;justify-content:space-between;gap:12px;align-items:center}
  .job .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
  .tag{font-size:11.5px;padding:3px 10px;border-radius:99px;white-space:nowrap;
       background:var(--soft);color:var(--dim)}
  .tag.done{background:#e8f6ee;color:var(--ok)}
  .tag.err{background:#fdeceb;color:var(--err)}
  .tag.run{background:var(--acc-soft);color:var(--acc)}
  .tag.cancel{background:#fdf3e3;color:var(--warn)}
  .bar{height:5px;background:var(--soft);border-radius:99px;overflow:hidden;margin:11px 0 9px}
  .bar>i{display:block;height:100%;width:0;background:var(--acc);
         border-radius:99px;transition:width .4s ease}
  .meta{color:var(--dim);font-size:12.5px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
  .meta b{color:var(--fg);font-weight:600}
  .meta .sp{flex:1}
  .mini{background:var(--panel);border:1px solid var(--line2);color:var(--dim);
        padding:3px 12px;font-size:12px;border-radius:7px}
  .mini:hover{border-color:var(--err);color:var(--err)}
  a.dl{color:var(--acc);font-weight:600;text-decoration:none}
  a.dl:hover{text-decoration:underline}
  pre.err{background:#fdeceb;border:1px solid #f7cfcb;color:#8f2318;padding:11px;
          border-radius:9px;font-size:12px;overflow:auto;max-height:200px;
          white-space:pre-wrap;margin:11px 0 0}
  .empty{color:var(--dim2);font-size:13px;padding:6px 0}
  .dot{display:inline-block;width:6px;height:6px;border-radius:99px;background:var(--acc);
       margin-right:7px;vertical-align:1px;animation:bl 1.1s ease-in-out infinite}
  @keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
</style>
</head>
<body>
<div class="wrap">

  <div class="hd">
    <h1>A733 视频超分</h1>
    <p>NPU 超分 · VE 硬编 · 全本地</p>
  </div>

  <div class="stat" id="stat"></div>
  <div class="det" id="det"></div>

  <div class="card">
    <div class="drop" id="drop">
      <b>拖视频到这里，或点击选择</b>
      <span>任意格式，ffmpeg 能解就行</span>
      <input type="file" id="file" accept="video/*" hidden>
    </div>

    <div class="fields">
      <label>或哔哩哔哩</label>
      <input type="text" id="url" placeholder="https://www.bilibili.com/video/BV... 或 b23.tv 短链">
      <button class="btn ghost" id="goUrl">用链接</button>
    </div>

    <div class="fields">
      <label>输出</label>
      <select id="res">
        <option value="720">720p</option>
        <option value="1080" selected>1080p</option>
        <option value="1440">1440p</option>
        <option value="2160">2160p（4K）</option>
        <option value="src2">跟随源 ×2</option>
        <option value="src4">跟随源 ×4</option>
      </select>
      <label>锐化</label>
      <select id="sharp">
        <option value="0">关</option>
        <option value="0.4" selected>轻（推荐）</option>
        <option value="0.8">强</option>
      </select>
      <button class="btn" id="go">开始超分</button>
    </div>

  </div>

  <div class="card">
    <h2 style="display:flex;justify-content:space-between;align-items:baseline">
      <span>任务</span>
      <span style="font-weight:400;color:var(--dim);font-size:12.5px" id="engine"></span>
    </h2>
    <div id="jobs"><div class="empty">还没有任务</div></div>
  </div>

</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================================================================ 系统状态
   数据走 SSE（/api/sys），服务端单点采样 1 Hz 推过来。
   前端【不重建 DOM】——每秒重建一次会让 hover 和文字选择一直被打断，
   所以只在第一次收到数据时建结构，之后只改文本和宽度。 */
let SYS = null, openKey = null;
const R = {};                       // 建好的行引用，供后续就地更新

const fmtGB = mb => (mb/1024).toFixed(mb >= 10240 ? 0 : 1) + ' GB';

function chipVal(k, s){
  if(k === 'temp'){
    const t = s.temp_max;
    if(!t) return {v:'—', s:'读不到', mute:true};
    // 收起状态也要能看出"已经到降频线了"——否则得点开才知道板子在烧
    return {v:t.c.toFixed(1)+'°C', s:t.label, mute:false, col:nearColor(tempPct(t))};
  }
  if(k === 'cpu'){
    const p = s.cpu_pct;
    const on = s.cpus.filter(c => c.online);
    // ★不要写"平均频率"：两个簇一个 416MHz 一个 1014MHz，平均出来的数
    //   不对应任何真实状态。要报就报最高频（大核那个）和核数。
    const mh = on.map(c => c.mhz).filter(x => x != null);
    return p == null ? {v:'—', s:'采样中', mute:true}
                     : {v:p.toFixed(0)+'%',
                        s:on.length + ' 核 · 最高 ' + (mh.length ? Math.max(...mh) : '—') + ' MHz',
                        mute:false};
  }
  if(k === 'mem'){
    const m = s.mem;
    return m ? {v:m.pct.toFixed(0)+'%', s:fmtGB(m.used_mb)+' / '+fmtGB(m.total_mb), mute:false}
             : {v:'—', s:'读不到', mute:true};
  }
  if(k === 'npu'){
    const n = s.npu || {};
    if(n.load == null) return {v:'—', s:n.note || '不可用', mute:true};
    return {v:n.load+'%', s:(n.freq_mhz ? n.freq_mhz+' MHz' : ''), mute:false};
  }
  if(k === 'gpu'){
    const g = s.gpu || {};
    if(g.load == null) return {v:'—', s:g.note || '不可用', mute:true};
    return {v:g.load+'%', s:'PowerVR BXM-4-64', mute:false};
  }
}

const CHIPS = [['temp','温度'],['cpu','CPU'],['mem','内存'],['npu','NPU'],['gpu','GPU']];

function buildChips(){
  $('#stat').innerHTML = CHIPS.map(([k,label]) => `
    <button class="chip" data-k="${k}">
      <span class="k">${label}</span><span class="v">–</span><span class="s"></span>
    </button>`).join('');
  $('#stat').querySelectorAll('.chip').forEach(b => {
    b.onclick = () => { openKey = (openKey === b.dataset.k) ? null : b.dataset.k;
                        buildDetail(); paint(); };
  });
}

function paint(){
  if(!SYS) return;
  $('#stat').querySelectorAll('.chip').forEach(b => {
    const d = chipVal(b.dataset.k, SYS);
    b.classList.toggle('on', openKey === b.dataset.k);
    b.classList.toggle('mute', !!d.mute);
    const v = b.querySelector('.v');
    v.textContent = d.v;
    v.style.color = d.col || '';
    b.querySelector('.s').textContent = d.s || '';
  });
  paintDetail();
}

/* 温度条的量程不是 0~100°C，而是【该传感器自己的首个降频阈值】——
   A733 上 CPU 是 60°C、板面 skin 只有 50°C。同一根温度计画所有传感器
   会让"板面 45°C"看起来比"CPU 55°C"安全，其实前者才更接近动手线。
   但这样每行的"满格"对应的绝对温度不同，所以行尾一律标出 /阈值。 */
function tempPct(t){ return t.trip ? Math.min(100, t.c / t.trip * 100) : 0; }
// 条一律蓝（用户要的就是黑白蓝）。只有真的逼近阈值时才让【数字】变色 ——
// 一眼扫过去，安静的界面意味着没事，跳出来的那个数才是要看的东西。
function nearColor(p){ return p >= 95 ? 'var(--err)' : p >= 85 ? 'var(--warn)' : ''; }

function buildDetail(){
  const d = $('#det');
  d.classList.toggle('on', !!openKey);
  if(!openKey){ d.innerHTML = ''; return; }
  for(const k in R) delete R[k];

  if(openKey === 'temp'){
    // 行是按温度降序排的，而温度每秒都在互相超车。若就地改数值不改顺序，
    // 屏幕上就成了"同一行的名字和数字各自乱跳"——看着像标签贴错了。
    // 所以只在【顺序真的变了】时重建行，其余时候原地改数值（不闪、hover 不断）。
    const order = (SYS?.temps || []).map(t => t.zone).join(',');
    if(!R.rows || R.tempOrder !== order){
      d.innerHTML = '<h3>温度传感器（按温度降序）</h3>'
        + (SYS?.temps || []).map(() => `
        <div class="mrow">
          <span class="nm"></span>
          <span class="bw"><i></i></span>
          <span class="vl"></span>
        </div>`).join('');
      R.rows = [...d.querySelectorAll('.mrow')];
      R.tempOrder = order;
    }
  }

  if(openKey === 'cpu'){
    const cs = SYS?.cpus || [];
    const cl = {};
    cs.forEach(c => (cl[c.cluster] = cl[c.cluster] || []).push(c));
    const keys = Object.keys(cl).sort();
    let h = '';
    keys.forEach((k, i) => {
      const g = cl[k];
      const name = keys.length === 1 ? '全部核心'
                 : i === 0 ? '小核' : i === keys.length - 1 ? '大核' : '簇 ' + k;
      // 型号名不能被 h3 的 text-transform:uppercase 吃掉大小写（CORTEX-A55 很怪）
      h += `<h3><span style="text-transform:none">${name} · ${esc(g[0].model || '')}</span>
              ×${g.length}
              <span style="float:right;font-weight:400;text-transform:none;letter-spacing:0"
                    data-cl="${k}"></span></h3>`;
      h += g.map(c => `<div class="mrow" data-cpu="${c.cpu}">
        <span class="nm">cpu${c.cpu}</span>
        <span class="bw"><i></i></span>
        <span class="vl"></span></div>`).join('');
    });
    d.innerHTML = h;
    R.cpu = [...d.querySelectorAll('.mrow')];
    R.cl = [...d.querySelectorAll('[data-cl]')];
  }

  if(openKey === 'mem'){
    const m = SYS?.mem, mi = SYS?.misc;
    if(!m){ d.innerHTML = '<div class="empty">读不到</div>'; return; }
    // 单位统一在每行里写好，别在渲染时猜（内存是 MB、磁盘是 GB）
    const rows = [
      ['已用',        m.used_mb, m.total_mb, m.pct, 'MB'],
      ['缓存 / 缓冲', m.cached_mb + m.buffers_mb, m.total_mb,
                      (m.cached_mb + m.buffers_mb) / m.total_mb * 100, 'MB'],
      ['zram 交换',   m.swap_used_mb, m.swap_total_mb,
                      m.swap_total_mb ? m.swap_used_mb / m.swap_total_mb * 100 : 0, 'MB'],
      ['磁盘 /',      mi?.disk?.used_gb, mi?.disk?.total_gb, mi?.disk?.pct || 0, 'GB'],
    ];
    d.innerHTML = '<h3>内存</h3>' + rows.map(r => `
      <div class="mrow">
        <span class="nm">${r[0]}</span>
        <span class="bw"><i></i></span>
        <span class="vl"></span>
      </div>`).join('') + `
      <h3>系统</h3>
      <dl class="kv">
        <dt>可用内存</dt><dd>${fmtGB(m.avail_mb)}</dd>
        <dt>交换区</dt><dd>zram（压缩后放内存里，不是磁盘）</dd>
        <dt>负载 1/5/15 分</dt><dd>${(mi?.load || []).join(' / ') || '—'}</dd>
        <dt>已运行</dt><dd>${mi?.uptime_s ? Math.floor(mi.uptime_s/3600) + ' 小时 ' +
             Math.floor(mi.uptime_s % 3600/60) + ' 分' : '—'}</dd>
        <dt>SoC</dt><dd>${esc(mi?.soc || '—')}</dd>
      </dl>`;
    R.rows = [...d.querySelectorAll('.mrow')];
    R.rowsData = rows;
  }

  if(openKey === 'npu' || openKey === 'gpu'){
    const o = (openKey === 'npu' ? SYS?.npu : SYS?.gpu) || {};
    let h = `<h3>${openKey.toUpperCase()} 负载</h3>`;
    if(o.load == null){
      h = `<h3>不可用</h3><div class="note">${esc(o.note || '读不到')}</div>`;
      d.innerHTML = h; return;
    }
    h += `<div class="mrow"><span class="nm">总利用率</span>
            <span class="bw"><i></i></span><span class="vl"></span></div>`;
    if(o.blocks) h += o.blocks.map(b => `
      <div class="mrow"><span class="nm">${esc(b.name)}</span>
        <span class="bw"><i></i></span><span class="vl"></span></div>`).join('');
    d.innerHTML = h;
    R.rows = [...d.querySelectorAll('.mrow')];
  }
}

function paintDetail(){
  if(!openKey || !SYS) return;
  if(openKey === 'temp' && R.rows){
    R.rows.forEach((el, i) => {
      const t = SYS.temps[i]; if(!t) return;
      const p = tempPct(t);
      el.querySelector('.nm').innerHTML = `<b>${esc(t.label)}</b>`;
      el.querySelector('.bw i').style.width = p + '%';
      const col = nearColor(p);
      el.querySelector('.vl').innerHTML =
        `<span style="${col ? 'color:' + col + ';font-weight:600' : ''}">${t.c.toFixed(1)}°C</span>`
        + ` <small>/ ${t.trip ?? '—'}</small>`;
    });
  }
  if(openKey === 'cpu' && R.cpu){
    R.cpu.forEach(el => {
      const c = SYS.cpus.find(x => x.cpu == el.dataset.cpu); if(!c) return;
      const p = c.pct || 0;
      el.querySelector('.bw i').style.width = Math.max(p, p > 0 ? 1.5 : 0) + '%';
      el.querySelector('.vl').innerHTML = `${Math.round(p)}% <small>${c.mhz ?? '—'}M</small>`;
    });
    R.cl.forEach(el => {
      const g = SYS.cpus.filter(c => c.cluster == el.dataset.cl);
      const mh = g.map(c => c.mhz).filter(x => x != null);
      el.textContent = (mh.length ? Math.min(...mh) : '—') + ' MHz';
    });
  }
  if(openKey === 'mem' && R.rows && R.rowsData){
    R.rows.forEach((el, i) => {
      const r = R.rowsData[i];
      const p = Math.max(0, Math.min(100, r[3] || 0));
      el.querySelector('.bw i').style.width = p + '%';
      const u = r[4], f = u === 'GB' ? 1 : 0;
      el.querySelector('.vl').innerHTML =
        `${(r[1] || 0).toFixed(f)} <small>/ ${(r[2] || 0).toFixed(f)} ${u}</small>`;
    });
  }
  if((openKey === 'npu' || openKey === 'gpu') && R.rows){
    const o = openKey === 'npu' ? SYS.npu : SYS.gpu;
    const vals = [o.load].concat((o.blocks || []).map(b => b.pct));
    R.rows.forEach((el, i) => {
      const p = vals[i] ?? 0;
      el.querySelector('.bw i').style.width = Math.max(p, p > 0 ? 1.5 : 0) + '%';
      el.querySelector('.vl').textContent = p + '%';
    });
  }
}

function sysConnect(){
  const es = new EventSource('/api/sys');
  es.onmessage = e => {
    try{
      const first = !SYS;
      SYS = JSON.parse(e.data);
      // 首次收到数据时把结构建出来。buildDetail 也要重跑一次：用户可能在
      // 数据到达【之前】就点开了某个卡片（那时 SYS 还是 null，建出的是空壳）。
      if(first){ buildChips(); buildDetail(); }
      paint();
    }catch(_){}
  };
  // EventSource 自己会重连，这里不用管；连不上就是状态栏空着，别的功能照常
}

/* ================================================================ 任务 */
let cur = null, timer = null;

function setBusy(b){ $('#go').disabled = b; $('#goUrl').disabled = b; }

// "输出"只有一个控件：给具体分辨率就用它，选"跟随源 ×N"就把倍率交给服务端算。
// 原来"倍率"和"分辨率"是两个控件且互相打架 —— 设了分辨率后倍率被静默忽略，
// 选 2× 和 4× 会产出完全一样的文件（实测确认过）。
function readRes(){
  const v = $('#res').value;
  if(v.startsWith('src')) return {target: 0, scale: +v.slice(3)};
  return {target: +v, scale: 2};
}

async function upload(file){
  const fd = new FormData();
  const q = new URLSearchParams(Object.assign(
    {name: file.name, sharp: $('#sharp').value}, readRes()));
  setBusy(true);
  const xhr = new XMLHttpRequest();      // 用 XHR 才有上传进度
  xhr.open('POST', '/api/upload?' + q);
  xhr.upload.onprogress = e => {
    if(e.lengthComputable) showProgress('上传中', e.loaded / e.total * 100);
  };
  xhr.onload = () => {
    setBusy(false);
    try { const r = JSON.parse(xhr.responseText);
          if(r.id) start(r.id); else alert(r.error || '上传失败'); }
    catch(e){ alert('上传失败'); }
  };
  xhr.onerror = () => { setBusy(false); alert('上传失败'); };
  xhr.send(file);
}

async function viaUrl(){
  const url = $('#url').value.trim();
  if(!url) return alert('填个链接');
  setBusy(true);
  const r = await (await fetch('/api/url', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(Object.assign({url, sharp:+$('#sharp').value}, readRes()))})).json();
  setBusy(false);
  if(r.id) start(r.id); else alert(r.error || '失败');
}

function showProgress(stage, pct){
  cur = {stage, progress: pct, status:'running'}; render();
}

// ★轮询独立出来：页面重新打开时也要能接着看同一个任务
//   （任务是服务端线程在跑，关浏览器不影响它，但浏览器这边得能重新挂上去）
function poll(id){
  if(timer) clearInterval(timer);
  timer = setInterval(async () => {
    const j = await (await fetch('/api/status?id=' + id)).json();
    if(j.error) return;
    cur = j; render();
    if(j.status === 'done' || j.status === 'error' || j.status === 'cancelled'){
      clearInterval(timer); timer = null; }
  }, 2000);
}

function start(id){
  cur = {id, stage:'排队', progress:1, status:'running'};
  render(); poll(id);
}

function render(){
  const j = cur; if(!j) return;
  const done = j.status === 'done';
  const cls = done ? 'done'
            : j.status === 'error' ? 'err'
            : j.status === 'cancelled' ? 'cancel' : 'run';
  // ★阶段文字。之前模板里引用了 ${label} 但从没定义过 —— JS 直接抛
  //   ReferenceError，整个 render() 挂掉，页面上什么都不显示（用户实测踩到）。
  const label = done ? '完成'
              : j.status === 'error' ? (j.stage === '已中断' ? '已中断' : '失败')
              : j.status === 'cancelled' ? '已取消'
              : (j.stage || '运行中');
  $('#jobs').innerHTML = `<div class="job">
    <div class="top">
      <span class="nm">${esc(j.name || j.id || '')}</span>
      <span class="tag ${cls}">${label.length > 14 ? '进行中' : esc(label)}</span>
    </div>
    <div class="bar"><i style="width:${j.progress||0}%"></i></div>
    <div class="meta">
      ${j.status === 'running' ? `<span><i class="dot"></i>${esc(label)}</span>`
                               : `<span>${esc(label)}</span>`}
      <span class="num">${(j.progress||0).toFixed(0)}%</span>
      ${j.frames_done ? `<span class="num">${j.frames_done} 帧</span>` : ''}
      ${j.fps_now ? `<span class="num">${j.fps_now} 帧/秒</span>` : ''}
      ${j.eta_s > 60 ? `<span class="num">约剩 ${Math.round(j.eta_s/60)} 分</span>` : ''}
      ${j.meta ? `<span>源 ${esc(j.meta.src)}</span>
                  <span>输出 <b>${esc(j.meta.final)}</b></span>
                  <span title="NBG 是 x4 的，中间帧必然是源×4，随后由 VE 缩放到输出尺寸">NPU 中间帧 ${esc(j.meta.sr)}</span>
                  <span>${j.meta.tiles} 块/帧</span>` : ''}
      ${j.size ? `<span class="num">${(j.size/1048576).toFixed(1)} MB</span>` : ''}
      ${j.took ? `<span class="num">耗时 ${j.took}s</span>` : ''}
      <span class="sp"></span>
      ${done ? `<a class="dl" href="/api/download?id=${j.id||''}&name=${encodeURIComponent((j.name||'sr').replace(/\.[^.]+$/,''))}">下载</a>` : ''}
      ${j.status === 'running' ? `<button class="mini" onclick="cancelJob('${j.id||''}')">取消</button>` : ''}
    </div>
    ${j.error ? `<pre class="err">${esc(j.error)}</pre>` : ''}
  </div>`;
}

async function cancelJob(id){
  if(!id) return;
  if(!confirm('取消这个任务？已完成的帧会丢掉。')) return;
  await fetch('/api/cancel?id=' + id, {method:'POST'});
}

$('#drop').onclick = () => $('#file').click();
$('#file').onchange = e => { if(e.target.files[0]) upload(e.target.files[0]); };
['dragenter','dragover'].forEach(ev => $('#drop').addEventListener(ev, e => {
  e.preventDefault(); $('#drop').classList.add('on'); }));
['dragleave','drop'].forEach(ev => $('#drop').addEventListener(ev, e => {
  e.preventDefault(); $('#drop').classList.remove('on'); }));
$('#drop').addEventListener('drop', e => {
  if(e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); });
$('#goUrl').onclick = viaUrl;
$('#go').onclick = () => $('#file').click();

sysConnect();

// 打开页面时恢复现场：接着显示最新的那个任务，在跑就继续轮询
fetch('/api/jobs').then(r=>r.json()).then(d=>{
  const list = d.jobs || [];
  // 界面上只渲染最近这一个任务（cur），所以别写"共 19 个"却不显示它们
  $('#engine').textContent = '最近 1 个 / 共 ' + list.length + ' 个 · 关掉网页不会中断';
  if(!list.length) return;
  const j = list[0];                 // 服务端已按时间倒序
  cur = j; render();
  if(j.status === 'running') poll(j.id);
}).catch(()=>{});
</script>
